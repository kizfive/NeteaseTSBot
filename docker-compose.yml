services:
  voice-service:
    image: docker.io/yumi118/neteasetsbot-voice-service:sha-0b69527
    env_file:
      - tsbot.env
    ports:
      - "50051:50051"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.local-backend
    image: tsbot-backend:v0.7.1-latest-patched
    env_file:
      - tsbot.env
    environment:
      TSBOT_HOST: 0.0.0.0
      TSBOT_PORT: 8009
      TSBOT_VOICE_GRPC_ADDR: voice-service:50051
      DATABASE_URL: sqlite:///./data/tsbot.db
    depends_on:
      - voice-service
    ports:
      - "8009:8009"
    volumes:
      - ./logs:/app/logs
      - ./data:/app/data
      - voicetmp:/app/tmp
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.local-web
    image: tsbot-web:v0.7.1-latest-playlist-search
    depends_on:
      - backend
    ports:
      - "6657:8080"
    restart: unless-stopped

volumes:
  voicetmp:
